name: Frost Line Android Baseline

on:
  push:
    branches: [ "frost-line-shasta-demo" ]
    paths:
      - "frostline-native/**"
      - ".github/workflows/frostline-native.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: frost-line-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build signed baseline APK
        run: gradle -p frostline-native assembleDebug --stacktrace

      - name: Verify APK package and signatures
        run: |
          APK="frostline-native/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$GITHUB_WORKSPACE/Frost-Line-Test-1.apk"
          cp "$APK" "$OUT"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          "$AAPT" dump badging "$OUT" | head -20
          test -s "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Line-Test-1-APK
          path: Frost-Line-Test-1.apk
          if-no-files-found: error
