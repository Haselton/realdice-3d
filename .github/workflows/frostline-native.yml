name: Frost Line Native 3D APK

on:
  push:
    branches: [ "frost-line-shasta-demo" ]
    paths:
      - "frostline-native/**"
      - ".github/workflows/frostline-native.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p frostline-native assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f frostline-native/app/build/outputs/apk/debug/app-debug.apk
          ls -lh frostline-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Line-Shasta-Native-3D-APK
          path: frostline-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
