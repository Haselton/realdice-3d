name: Frost Line Native 3D APK

on:
  push:
    branches: [ "frost-line-shasta-demo" ]
    paths:
      - "frostline-native/**"
      - ".github/workflows/frostline-native.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p frostline-native assembleDebug --stacktrace

      - name: Create test signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/frostline-test.jks" \
            -storepass android \
            -keypass android \
            -alias frostline \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Frost Line Test,O=Haselton Media Group,C=US"

      - name: Sign and verify APK
        run: |
          APK="frostline-native/app/build/outputs/apk/debug/app-debug.apk"
          OUT="frostline-native/app/build/outputs/apk/debug/Frost-Line-Shasta-Compat2-SIGNED.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/frostline-test.jks" \
            --ks-key-alias frostline \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Line-Shasta-Compat2-SIGNED-APK
          path: frostline-native/app/build/outputs/apk/debug/Frost-Line-Shasta-Compat2-SIGNED.apk
          if-no-files-found: error
