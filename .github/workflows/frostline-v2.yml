name: Frost Line Shasta v2 APK

on:
  push:
    branches: [ "frost-line-shasta-demo" ]
    paths:
      - "frostline-v2/**"
      - ".github/workflows/frostline-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3 and Android templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          cp -r templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import and validate project
        run: godot --headless --editor --path frostline-v2 --quit --verbose

      - name: Export APK
        run: |
          godot --headless --path frostline-v2 --export-debug Android "$GITHUB_WORKSPACE/Frost_Line_Shasta_v2.apk" --verbose
          ls -lh "$GITHUB_WORKSPACE/Frost_Line_Shasta_v2.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Line-Shasta-v2-APK
          path: Frost_Line_Shasta_v2.apk
          if-no-files-found: error
