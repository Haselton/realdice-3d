name: RealCoin 3D Test APK
on:
  push:
    branches: [ realcoin-test-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' || true
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate high-detail Blender coin mesh
        run: |
          mkdir -p RealCoin3D/app/src/main/assets
          REALCOIN_OBJ=RealCoin3D/app/src/main/assets/quarter_high.obj blender -b --python tools/generate_realcoin_mesh.py
          test -s RealCoin3D/app/src/main/assets/quarter_high.obj
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: RealCoin3D
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RealCoin3D-test-apk
          path: RealCoin3D/app/build/outputs/apk/debug/*.apk
