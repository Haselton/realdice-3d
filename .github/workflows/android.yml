name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix MultiDice Kotlin syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/haseltonmediagroup/realdice3d/MultiDice3DView.kt')
          s = p.read_text()
          original = 'if(ax>=ay&&ax>=az)dx=if(x>=0)1f else -1f else if(ay>=ax&&ay>=az)dy=if(y>=0)1f else -1f else dz=if(z>=0)1f else -1f'
          patched = 'if(ax>=ay&&ax>=az)dx=(if(x>=0)1f else -1f) else if(ay>=ax&&ay>=az)dy=(if(y>=0)1f else -1f) else dz=(if(z>=0)1f else -1f)'
          fixed = 'if(ax>=ay&&ax>=az){dx=if(x>=0)1f else -1f}else if(ay>=ax&&ay>=az){dy=if(y>=0)1f else -1f}else{dz=if(z>=0)1f else -1f}'
          s = s.replace(original, fixed).replace(patched, fixed)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release AAB
        run: gradle bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RealDice3D-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
