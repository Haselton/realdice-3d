name: APK Verify

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply same rounded-cube repair used by production build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          y = Path('.github/workflows/android.yml').read_text()
          m = re.search(r"python3 - <<'PY'\n(.*?)\n\s*PY", y, re.S)
          if not m:
              raise SystemExit('Could not extract production repair script')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          exec(compile(script, '<production-repair>', 'exec'))
          PY
      - name: Build installable APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RealDice3D-next-submission-APK
          path: app/build/outputs/apk/debug/*.apk
