plugins {
    id 'com.android.application'
}

android {
    namespace 'com.haseltonmediagroup.frostline3d'
    compileSdk 35

    defaultConfig {
        // Fresh test package prevents signature collision with earlier experimental APKs.
        applicationId 'com.haseltonmediagroup.frostline3d.compat3'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.5-compat3'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
