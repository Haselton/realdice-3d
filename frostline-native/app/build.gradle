plugins {
    id 'com.android.application'
}

android {
    namespace 'com.haseltonmediagroup.frostline3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haseltonmediagroup.frostline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-baseline'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
